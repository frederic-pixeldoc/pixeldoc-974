# Builds Netlify suspendus : conserver ce bloc. Le site pixeldoc-974 est publie par depot manuel (CLI) ; un push ne doit pas le remplacer.
# Pour reactiver les builds depuis GitHub : supprimer le bloc [build] ci-dessous (decision de F.).
[build]
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
