# Builds Netlify suspendus (crédit épuisé) : le site est servi gratuitement par GitHub Pages.
# Pour réactiver Netlify : supprimer le bloc [build] ci-dessous.
[build]
  ignore = "exit 0"

# Configuration Netlify (ignorée par GitHub Pages)
[[headers]]
  for = "/*"
  [headers.values]
    # À RETIRER À L'OUVERTURE : site non indexable tant que PixelDoc n'est pas ouvert (voir OUVERTURE.md)
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
